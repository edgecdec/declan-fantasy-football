name: Daily Player Update

on:
  schedule:
    # Run at 8:00 AM UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-players:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    # One block on purpose: if the player database fails to build, the rankings
    # scripts read it and would either crash anyway or regenerate from stale input.
    # `bash -e` aborting here is the wanted behaviour.
    - name: Run update script
      run: |
        python scripts/update_players.py
        python scripts/generate_rankings.py
        python scripts/generate_dynasty_rankings.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add data/sleeper_players.json data/player_index.json data/redraft/ data/dynasty/
        git commit -m "Auto-update Sleeper player database" || exit 0
        git push
